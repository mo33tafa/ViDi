[package]
name = "vidi-cli"
version = "1.0.0"
edition = "2021"
description = "vidi - System inspection and diagnostics CLI for Linux and Windows"
authors = ["Mostafa Heshmatpour"]
license = "MIT"
repository = "https://github.com/mo33tafa/vidi"
readme = "README.md"

[[bin]]
name = "vidi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
sysinfo = "0.30"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
